[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "raspi-openweather"
description = "Light-weight full-screen weather display for Raspberry Pi"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = [
    "pygame>=2.1",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.5",
]

[project.scripts]
raspi-openweather = "raspi_openweather.app:main"

[tool.setuptools]
packages = ["raspi_openweather"]

[tool.setuptools.dynamic]
version = { attr = "raspi_openweather.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["raspi_openweather"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
